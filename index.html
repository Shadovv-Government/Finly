<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>Finly — Управление личными финансами</title>
    <meta name="description" content="Умное приложение для управления личными финансами с AI-аналитикой" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data: blob:; worker-src 'self';" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Preconnect to font origins — eliminates DNS+TCP+TLS from critical path -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load font CSS via <link> instead of CSS @import — discovered by preload scanner immediately -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <style>
      #root-loading {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) { #root-loading { background: #09090b; } }
      #root-loading span {
        width: 32px; height: 32px; border-radius: 50%;
        border: 2px solid #7c3aed; border-top-color: transparent;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #root:not(:empty) ~ #root-loading { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="root-loading" aria-hidden="true"><span></span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
